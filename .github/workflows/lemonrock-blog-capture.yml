name: Lemonrock Blog Capture

on:
  pull_request:
    branches: [main]
    paths:
      - tools/lemonrock_blog_capture.py
      - .github/workflows/lemonrock-blog-capture.yml
  push:
    branches:
      - chore/lemonrock-blog-analysis-20260802
    paths:
      - tools/lemonrock_blog_capture.py
      - .github/workflows/lemonrock-blog-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Capture Lemonrock editor blog
        run: python tools/lemonrock_blog_capture.py
        env:
          OUTPUT_DIR: lemonrock_editor_blog_capture
          LEMONROCK_DELAY: "0.50"
          REQUEST_TIMEOUT: "30"

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemonrock-editor-blog-capture
          path: lemonrock_editor_blog_capture/
          retention-days: 3
          if-no-files-found: error
